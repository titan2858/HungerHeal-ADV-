server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames change on every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must NEVER be cached. It is the file that references the hashed
  # bundles, so a stale copy points at assets that no longer exist - the
  # classic "users see a white page after deploy" bug.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Everything under /api and /uploads goes to the gateway.
  #
  # Same-origin in production, so there is no CORS to configure and no list of
  # service ports for the browser to know about. In development Vite's proxy
  # plays exactly this role, which is why the frontend code is identical either
  # way.
  location /api/ {
    proxy_pass http://api-gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long enough for a slow geocode; the gateway has its own timeout.
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://api-gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Single-page app: any unknown path is a client-side route, so serve
  # index.html and let React decide rather than returning 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
