# HungerHeal — infrastructure + services
#
# Phase 0 brings up ONLY the infrastructure every later phase depends on:
#   mongo   — primary datastore for auth-service (users) and donation-service (donations)
#   redis   — agent geo index (GEOADD/GEOSEARCH), load counters, geocode cache, Kafka dedup keys
#   kafka   — the event bus every service talks over (KRaft mode: no Zookeeper needed)
#   kafka-ui— browser UI at http://localhost:8090 to SEE topics/messages while learning Kafka
#
# Application services are added to this same file as each phase is built,
# so the whole system always comes up with one `docker compose up -d`.

name: hungerheal

services:
  # ---------------------------------------------------------------- MongoDB
  mongo:
    image: mongo:7
    container_name: hh-mongo
    restart: unless-stopped
    ports:
      # Host 27018 on purpose: this machine already runs a local mongod on 27017.
      # Inside the docker network the port is still the normal 27017.
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-hungerheal}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-hungerheal_dev_pw}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [hungerheal]

  # ------------------------------------------------------------------ Redis
  redis:
    image: redis:7-alpine
    container_name: hh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # appendonly = write every change to a log file so a container restart
    # does not silently wipe agent locations / load counters mid-demo.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [hungerheal]

  # ------------------------------------------------------------------ Kafka
  # Single-broker KRaft setup: this one container is both the controller
  # (cluster metadata) and the broker (actual message storage).
  kafka:
    image: apache/kafka:3.9.1
    container_name: hh-kafka
    restart: unless-stopped
    ports:
      # 29092 is the listener for clients running on the HOST (your laptop):
      # `go run ./...` or `npm run dev` outside docker connect to localhost:29092.
      # Services running INSIDE docker use kafka:9092 instead.
      - "29092:29092"
    environment:
      # --- KRaft identity ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: hungerheal-local-cluster
      # --- Listeners ---
      # Three listeners: internal (docker), controller (KRaft internals), host (your laptop).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- Single-broker sanity: default is 3 replicas, which a 1-broker cluster cannot satisfy ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by scripts/create-topics.sh, but leaving
      # auto-create on avoids a dead-end if a consumer starts first while learning.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [hungerheal]

  # --------------------------------------------------------------- Kafka UI
  # Not part of the architecture — a learning/debugging window into Kafka.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hh-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hungerheal-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [hungerheal]

  # -------------------------------------------------------------- Cassandra
  # Phase 11, optional. Gated behind a profile so it does not eat ~1.5GB RAM
  # during normal development. Start it with:
  #   docker compose --profile analytics up -d
  cassandra:
    image: cassandra:5
    container_name: hh-cassandra
    profiles: ["analytics"]
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: hungerheal
      # Single-node dev footprint; the defaults assume a real cluster.
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [hungerheal]

  # ----------------------------------------------------- auth-service (Phase 1)
  auth-service:
    build:
      context: ./services/auth-service
    container_name: hh-auth
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      SERVICE_NAME: auth-service
      # Inside the compose network Mongo is mongo:27017, not localhost:27018.
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-hungerheal}:${MONGO_ROOT_PASSWORD:-hungerheal_dev_pw}@mongo:27017/?authSource=admin
      MONGO_DB_NAME: hh_auth
      # Every service that verifies a token must share this exact secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: 10
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      # Waiting for healthy, not merely started: mongo accepts TCP connections
      # before it is ready to serve queries.
      mongo:
        condition: service_healthy
    networks: [hungerheal]

  # ------------------------------------------------- donation-service (Phase 2)
  donation-service:
    build:
      context: ./services/donation-service
    container_name: hh-donations
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      SERVICE_NAME: donation-service
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-hungerheal}:${MONGO_ROOT_PASSWORD:-hungerheal_dev_pw}@mongo:27017/?authSource=admin
      # Its own database - donation-service never reads auth-service's data.
      MONGO_DB_NAME: hh_donations
      # Must be identical to auth-service's, or the tokens it issues are rejected here.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      # Inside the compose network the broker is kafka:9092, not localhost:29092.
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: donation-service
      KAFKA_ENABLED: "true"
      OUTBOX_SWEEP_INTERVAL_MS: 15000
      UPLOAD_DIR: /app/uploads
      # Inside the compose network, not localhost.
      GEOCODING_URL: http://geocoding-service:4003
      GEOCODING_TIMEOUT_MS: 5000
      GEOCODING_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Donation photos outlive the container. Local disk is the pragmatic
      # choice here; object storage is the honest production answer, since this
      # volume does not work once the service runs as more than one replica.
      - donation-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      # Waiting for kafka is about a clean startup, not a hard requirement:
      # donations are accepted even with the broker down, and their events are
      # replayed by the outbox sweeper.
      kafka:
        condition: service_healthy
      # Not a hard dependency in behaviour - a donation is still accepted if
      # geocoding is unavailable, just without coordinates.
      geocoding-service:
        condition: service_started
    networks: [hungerheal]

  # ------------------------------------------------ geocoding-service (Phase 3)
  geocoding-service:
    build:
      context: ./services/geocoding-service
    container_name: hh-geocoding
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      NODE_ENV: production
      PORT: 4003
      SERVICE_NAME: geocoding-service
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      REDIS_URL: redis://redis:6379
      # auto = use OpenCage when a key is present, the offline geocoder when not,
      # so the stack works end to end before anyone signs up for a key.
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-auto}
      OPENCAGE_API_KEY: ${OPENCAGE_API_KEY:-}
      # 30 days - a street address does not move.
      CACHE_TTL_SECONDS: 2592000
      # 1 hour - "not found" can become "found" when the provider updates.
      NEGATIVE_CACHE_TTL_SECONDS: 3600
      DAILY_REQUEST_QUOTA: ${DAILY_REQUEST_QUOTA:-2400}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    networks: [hungerheal]

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  cassandra-data:
  donation-uploads:

networks:
  hungerheal:
    name: hungerheal
    driver: bridge
